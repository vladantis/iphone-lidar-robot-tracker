name: Build Unsigned iOS IPA (for Windows Sideloadly)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile iOS ARKit + LiDAR App on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project from project.yml
        working-directory: ios-app
        run: |
          xcodegen generate

      - name: Build Unsigned Release .app for iPhone (arm64)
        working-directory: ios-app
        run: |
          xcodebuild clean build \
            -project LiDARBotTracker.xcodeproj \
            -scheme LiDARBotTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .app into Sideloadly-ready .ipa
        working-directory: ios-app
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LiDARBotTracker.app Payload/
          zip -r LiDARBotTracker-unsigned.ipa Payload

      - name: Upload LiDARBotTracker.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiDARBotTracker-iOS-IPA
          path: ios-app/LiDARBotTracker-unsigned.ipa
          retention-days: 30
